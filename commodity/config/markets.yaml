# MCX statutory/transaction charges as fraction of turnover (VERIFY: SEBI/MCX circulars, broker schedule)
mcx_charges:
  ctt_sell: 0.0001          # Commodity Transaction Tax 0.01% on sell side, non-agri futures
  exchange_txn: 0.000021    # exchange transaction charge (approx.)
  sebi_fee: 0.000001        # Rs 10 per crore
  stamp_duty_buy: 0.00002   # 0.002% buy side
  gst_on_fees: 0.18
