# Pre-registered hypotheses (documented BEFORE testing). Generated from a reviewed definition;
# parameter grids are fixed here and nothing outside them may be searched.
# Splits: TRAIN (first 50%) -> VALIDATION (next 25%) -> OUT-OF-SAMPLE (final 25%, touched once),
# plus expanding walk-forward on TRAIN+VALIDATION. Research type: A single TS, B cross/RV, C cross-sectional.
hypotheses:
- venue: GLOBAL
  position_size: volatility-targeted (10% annualised per instrument, EWMA hl 30d), capped 1x notional
  test_period: TRAIN + VALIDATION (first 75% of each root's history); expanding walk-forward
  oos_period: final 25% of history (hold-out, evaluated once)
  data_required: individual contracts (settle, OHLC, volume, OI) and contract calendar
  status: REGISTERED
